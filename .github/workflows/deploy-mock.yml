# Builds the static mock portal (yarn build:static) and uploads dist-static/ over SFTP.
# Needs repo secret SSH_PRIVATE_KEY and variables SSH_HOST, SSH_USER, SSH_PORT,
# SSH_KNOWN_HOSTS and DEPLOY_PATH (the subdomain's document root).
name: Deploy mock portal

on:
  push:
    branches: [feature/mock-dev-mode]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Refuse to deploy over a production site
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then echo "DEPLOY_PATH is not set"; exit 1; fi
          case "${DEPLOY_PATH%/}" in
            */public_html) echo "Refusing to deploy to public_html"; exit 1 ;;
          esac

      - name: Check required settings
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -z "$SSH_PRIVATE_KEY" ] && missing="$missing secret:SSH_PRIVATE_KEY"
          for name in SSH_HOST SSH_USER SSH_PORT SSH_KNOWN_HOSTS; do
            [ -z "${!name}" ] && missing="$missing variable:$name"
          done
          if [ -n "$missing" ]; then echo "Missing repo settings:$missing"; exit 1; fi

      - run: yarn install --frozen-lockfile
      - run: STATIC_BASE="" yarn build:static

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key" && chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Check the SSH connection
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'echo connected'

      - name: Upload over SFTP
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # No --delete: files already on the server that aren't in the build are left alone.
          cat > "$RUNNER_TEMP/deploy.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          open sftp://$SSH_USER@$SSH_HOST:$SSH_PORT
          mirror -R --verbose --parallel=4 dist-static $DEPLOY_PATH
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/deploy.lftp"
          lftp -f "$RUNNER_TEMP/deploy.lftp"
